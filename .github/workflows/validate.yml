name: Toikatsu v0.1 Validation

on:
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Toikatsu v0.1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.18,<5"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/validate_examples.py

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("schemas").rglob("*.json"))
          paths += sorted(Path("examples/v0.1").rglob("*.json"))

          if not paths:
              raise SystemExit("ERROR: No JSON files found.")

          for path in paths:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"[JSON OK] {path}")

          print(f"JSON syntax: {len(paths)} files passed")
          PY

      - name: Validate PASS and FAIL examples
        run: |
          python scripts/validate_examples.py

      - name: Validation summary
        if: success()
        run: |
          echo "## Toikatsu v0.1 Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- JSON syntax: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- JSON Schema validation: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Semantic validation: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- PASS/FAIL expectations: MATCH" >> "$GITHUB_STEP_SUMMARY"
